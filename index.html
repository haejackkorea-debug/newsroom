<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해적왕 뉴스룸 - 맞춤형 뉴스 대시보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #080d1e;
      --bg-sidebar: #0c142c;
      --bg-card: #121c3d;
      --bg-card-hover: #17244e;
      --bg-accent: #1e5eff;
      --bg-accent-hover: #154cd6;
      --bg-chip: #192754;
      --border-color: #1e2e60;
      --text-main: #f0f4fd;
      --text-muted: #8c9dc3;
      --text-dim: #5c6d94;
      --tag-bg: rgba(30, 94, 255, 0.2);
      --tag-text: #6997ff;
      --success: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* TOP HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 64px;
      background-color: rgba(12, 20, 44, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #1e5eff, #00d2ff);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(30, 94, 255, 0.3);
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .edition-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-chip);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .edition-badge .live-dot {
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    .header-center {
      flex: 1;
      max-width: 500px;
      margin: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .edition-selector {
      display: flex;
      background: #0a1127;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 3px;
      flex-shrink: 0;
    }

    .edition-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .edition-btn.active {
      background: var(--bg-accent);
      color: white;
      box-shadow: 0 2px 8px rgba(30, 94, 255, 0.4);
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 38px;
      background: #0a1127;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0 16px 0 38px;
      color: white;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--bg-accent);
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .status-text {
      font-size: 12px;
      color: var(--text-dim);
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #0b132b;
      border: 2px solid var(--border-color);
    }

    /* 3 COLUMNS LAYOUT */
    .app-container {
      display: grid;
      grid-template-columns: 220px 1fr 340px;
      min-height: calc(100vh - 64px);
      max-width: 1680px;
      margin: 0 auto;
    }

    /* LEFT SIDEBAR */
    .sidebar-left {
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      padding: 20px 12px;
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
      overflow-y: auto;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-item:hover {
      background: var(--bg-chip);
      color: var(--text-main);
    }

    .nav-item.active {
      background: var(--bg-accent);
      color: #fff;
      box-shadow: 0 4px 12px rgba(30, 94, 255, 0.3);
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* CENTER FEED */
    .main-feed {
      padding: 24px 28px;
      overflow-y: auto;
    }

    .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .feed-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .feed-tabs {
      display: flex;
      gap: 6px;
    }

    .feed-tab {
      padding: 6px 14px;
      background: var(--bg-chip);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .feed-tab.active {
      background: var(--bg-accent);
      color: white;
      border-color: var(--bg-accent);
    }

    /* UPDATE ALERT BANNER */
    .update-banner {
      background: linear-gradient(90deg, #102357, #19388a);
      border: 1px solid #234ca8;
      border-radius: 12px;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #8bb4ff;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 24px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(16, 35, 87, 0.4);
      transition: transform 0.2s, background 0.2s;
    }

    .update-banner:hover {
      transform: translateY(-2px);
      background: linear-gradient(90deg, #132a69, #1e45aa);
      color: #fff;
    }

    .update-banner .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* TOAST NOTIFICATION */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e5eff;
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* CARDS GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    .news-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .news-card:hover {
      transform: translateY(-3px);
      border-color: #2b4592;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
    }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      height: 180px;
      overflow: hidden;
      background: #091226;
    }

    .card-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }

    .news-card:hover .card-thumb-wrap img {
      transform: scale(1.04);
    }

    .card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(10, 17, 39, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #9cb3e6;
    }

    .card-body {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-category {
      font-size: 12px;
      font-weight: 700;
      color: var(--tag-text);
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 8px;
      color: #fff;
    }

    .card-summary {
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 14px;
      flex: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    /* STEP 2: EXPANDABLE WHY IT MATTERS */
    .why-matters-box {
      background: #0b1531;
      border: 1px solid #1c2e63;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.5;
      color: #9db2e2;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .why-matters-box.show {
      display: block;
    }

    .why-matters-box strong {
      color: #4da3ff;
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #182650;
      padding-top: 12px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: var(--bg-chip);
      color: #fff;
    }

    .action-btn.active {
      color: #ffb703;
    }

    .action-btn.why-btn {
      color: #5ea0ff;
    }

    /* RIGHT SIDEBAR */
    .sidebar-right {
      background-color: var(--bg-sidebar);
      border-left: 1px solid var(--border-color);
      padding: 20px 16px;
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* NEWS FACTORY BOX */
    .newsfactory-card {
      background: #111a38;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
    }

    .newsfactory-banner {
      height: 90px;
      position: relative;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .newsfactory-banner h3 {
      font-size: 16px;
      font-weight: 800;
      color: white;
    }

    .newsfactory-banner p {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.7);
    }

    .newsfactory-tabs {
      display: flex;
      padding: 10px 12px 0 12px;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .nf-tab {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .nf-tab.active {
      color: #fff;
      border-bottom-color: var(--bg-accent);
    }

    .nf-items-list {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nf-item {
      padding: 10px 12px;
      background: #0d152e;
      border-radius: 10px;
      border: 1px solid #1a2853;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .nf-item:hover {
      background: #131e42;
    }

    .nf-item-icon {
      color: #5998ff;
      margin-top: 2px;
    }

    .nf-item-content h4 {
      font-size: 13px;
      font-weight: 700;
      color: #e5edff;
      margin-bottom: 2px;
    }

    .nf-item-content p {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .nf-read-btn {
      width: calc(100% - 24px);
      margin: 4px 12px 14px 12px;
      background: var(--bg-accent);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .nf-read-btn:hover {
      background: var(--bg-accent-hover);
    }

    /* SOOP SECTION */
    .soop-section {
      background: #111a38;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-header h3 {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-header span {
      font-size: 11px;
      color: var(--text-dim);
    }

    .streamer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .streamer-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
      background: #0d152e;
    }

    .streamer-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #253b75;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    .streamer-info {
      flex: 1;
    }

    .streamer-info h5 {
      font-size: 12px;
      color: #fff;
    }

    .streamer-info p {
      font-size: 11px;
      color: var(--text-dim);
    }

    /* REGIONAL SECTION */
    .regional-section {
      background: #111a38;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
    }

    .regional-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .region-chip {
      background: #0d152e;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .region-chip:hover, .region-chip.active {
      background: var(--bg-accent);
      color: white;
      border-color: var(--bg-accent);
    }

    /* STEP 3: DETAIL MODAL */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 7, 18, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-container {
      background: #111a38;
      border: 1px solid #233772;
      border-radius: 20px;
      width: 100%;
      max-width: 720px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      animation: modalUp 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: #111a38;
      z-index: 10;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 26px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    .modal-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .modal-section {
      background: #0d152e;
      border: 1px solid #1a2750;
      border-radius: 12px;
      padding: 16px;
    }

    .modal-section h4 {
      font-size: 13px;
      font-weight: 700;
      color: #5998ff;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-section p {
      font-size: 14px;
      line-height: 1.6;
      color: #cfdcf7;
    }

    .fact-check-box {
      border-left: 3px solid #00e676;
    }

    .source-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #70a5ff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      margin-top: 6px;
    }

    .source-link-btn:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes modalUp {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* RESPONSIVE (MOBILE) */
    @media (max-width: 1024px) {
      .app-container {
        grid-template-columns: 1fr;
      }

      .sidebar-left, .sidebar-right {
        display: none;
      }

      header {
        padding: 0 16px;
      }

      .brand-title {
        font-size: 17px;
      }

      .header-center {
        display: none;
      }

      .main-feed {
        padding: 16px;
      }

      .cards-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .mobile-edition-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        background: #0f1837;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
      }
    }

    @media (min-width: 1025px) {
      .mobile-edition-bar {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header>
    <div class="brand-section" onclick="filterCategory('all', document.querySelector('.nav-item'))">
      <div class="logo-icon">🏴‍☠️</div>
      <div class="brand-title">해적왕 뉴스룸</div>
      <div class="edition-badge">
        <span class="live-dot"></span>
        <span id="header-date">10월 3일 · 오전 6시판</span>
      </div>
    </div>

    <div class="header-center">
      <div class="edition-selector">
        <button class="edition-btn active" id="btn-morning" onclick="switchEdition('morning')">오전 6시판</button>
        <button class="edition-btn" id="btn-afternoon" onclick="switchEdition('afternoon')">오후 4시판</button>
      </div>
      <div class="search-box">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input type="text" placeholder="뉴스 검색 (AI, 로봇, 무안 등)..." id="search-input" oninput="handleSearch()">
      </div>
    </div>

    <div class="header-right">

    async function loadDataFromRepo(showToast = false) {
      const spinner = document.getElementById("banner-spinner");
      const icon = document.getElementById("banner-icon");
      if (spinner) spinner.style.display = "inline-block";
      if (icon) icon.style.display = "none";

      try {
        // Cache buster to ensure latest GitHub Pages content is fetched
        const res = await fetch("./data/latest.json?v=" + new Date().getTime());
        if (res.ok) {
          const json = await res.json();
          if (json.morning && json.morning.articles && json.morning.articles.length > 0) {
            activeData = json;
            document.getElementById("status-update-time").innerText = "최신 동기화 완료";
          }
        }
      } catch (e) {
        console.log("Using built-in data:", e);
      } finally {
        if (spinner) spinner.style.display = "none";
        if (icon) icon.style.display = "inline";
      }

      renderAll();
      if (showToast) {
        showToastMsg("최신 뉴스 브리핑으로 갱신되었습니다!");
      }
    }

    function forceRefreshLatest() {
      loadDataFromRepo(true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showToastMsg(msg) {
      const toast = document.getElementById("toast-msg");
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function switchEdition(edition) {
      currentEdition = edition;
      document.getElementById("btn-morning").classList.toggle("active", edition === "morning");
      document.getElementById("btn-afternoon").classList.toggle("active", edition === "afternoon");
      document.getElementById("m-btn-morning").classList.toggle("active", edition === "morning");
      document.getElementById("m-btn-afternoon").classList.toggle("active", edition === "afternoon");

      const editionData = activeData[edition] || EMBEDDED_DATA[edition];
      document.getElementById("header-date").innerText = editionData.date + " · " + (edition === 'morning' ? '오전 6시판' : '오후 4시판');
      document.getElementById("nf-time-label").innerText = edition === 'morning' ? '아침 브리핑 요약' : '당일 방송 코너별 브리핑';

      renderCards();
      renderRightSidebar();
    }

    function filterCategory(cat, el) {
      currentCategory = cat;
      document.querySelectorAll(".nav-item").forEach(item => item.classList.remove("active"));
      if (el) el.classList.add("active");
      
      document.getElementById("current-category-title").innerText = cat === 'all' ? '내 맞춤 뉴스' : cat;
      renderCards();
    }

    function showSavedOnly(el) {
      currentCategory = "saved";
      document.querySelectorAll(".nav-item").forEach(item => item.classList.remove("active"));
      if (el) el.classList.add("active");
      document.getElementById("current-category-title").innerText = "보관함";
      renderCards();
    }

    function setFeedTab(tab, el) {
      activeFeedTab = tab;
      document.querySelectorAll(".feed-tab").forEach(t => t.classList.remove("active"));
      el.classList.add("active");
      renderCards();
    }

    function filterRegion(reg, el) {
      document.querySelectorAll(".region-chip").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      currentCategory = "전국·지역";
      document.getElementById("current-category-title").innerText = `전국 · 지역 소식 (${reg})`;
      renderCards(reg);
    }

    function toggleSave(id, e) {
      e.stopPropagation();
      const idx = savedIds.indexOf(id);
      if (idx > -1) {
        savedIds.splice(idx, 1);
        showToastMsg("보관함에서 제거되었습니다.");
      } else {
        savedIds.push(id);
        showToastMsg("보관함에 저장되었습니다.");
      }
      localStorage.setItem("haejack_saved_news", JSON.stringify(savedIds));
      renderCards();
    }

    function renderCards(regionFilter) {
      const container = document.getElementById("news-cards-container");
      container.innerHTML = "";

      const editionData = activeData[currentEdition] || EMBEDDED_DATA[currentEdition];
      let list = [...editionData.articles];

      // Filter by category
      if (currentCategory === "saved") {
        list = list.filter(a => savedIds.includes(a.id));
      } else if (currentCategory === "SOOP") {
        list = list.filter(a => a.category.includes("SOOP") || a.badge.includes("스트리머"));
      } else if (currentCategory !== "all") {
        list = list.filter(a => a.category.includes(currentCategory) || a.badge.includes(currentCategory));
      }

      // Region Filter
      if (regionFilter && regionFilter !== "전국") {
        list = list.filter(a => (a.summary + a.title + a.badge).includes(regionFilter));
      }

      // Filter by tabs
      if (activeFeedTab === "unread") {
        list = list.filter(a => !readIds.includes(a.id));
      } else if (activeFeedTab === "recommend") {
        list.sort((a, b) => (likedIds.includes(b.id) ? 1 : 0) - (likedIds.includes(a.id) ? 1 : 0));
      }

      // Update banner text count
      const bannerText = document.getElementById("banner-text");
      if (bannerText) {
        bannerText.innerText = `새 뉴스 ${editionData.articles.length}건 · 눌러서 최신 브리핑 동기화`;
      }

      if (list.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-dim);">
            <div style="font-size: 36px; margin-bottom: 12px;">📭</div>
            <p style="font-size: 15px;">해당 조건에 일치하는 뉴스가 없습니다.</p>
          </div>
        `;
        return;
      }

      list.forEach(article => {
        const isSaved = savedIds.includes(article.id);
        const isLiked = likedIds.includes(article.id);
        const isRead = readIds.includes(article.id);

        const card = document.createElement("div");
        card.className = "news-card";
        card.onclick = () => openModal(article.id);

        card.innerHTML = `
          <div class="card-thumb-wrap">
            <img src="${article.thumb}" alt="썸네일" loading="lazy">
            <span class="card-badge">${article.badge || '브리핑'}</span>
          </div>
          <div class="card-body">
            <div class="card-category">${article.category} ${isRead ? '<span style="color:var(--text-dim);font-weight:400;">(읽음)</span>' : ''}</div>
            <h3 class="card-title">${article.title}</h3>
            <p class="card-summary">${article.summary}</p>
            <div class="card-meta">
              <span>${article.source}</span>
              <span>•</span>
              <span>${article.time}</span>
            </div>
            
            <!-- STEP 2: WHY IT MATTERS -->
            <div class="why-matters-box" id="why-${article.id}">
              <strong>💡 왜 중요한가 (나의 관점)</strong>
              ${article.whyMatters}
            </div>

            <div class="card-actions">
              <button class="action-btn ${isLiked ? 'active' : ''}" onclick="toggleLike('${article.id}', event)">
                ${isLiked ? '⭐ 관심 있음' : '☆ 관심 있어요'}
              </button>
              <button class="action-btn ${isSaved ? 'active' : ''}" onclick="toggleSave('${article.id}', event)" title="보관">
                ${isSaved ? '🔖 보관됨' : '📑 보관'}
              </button>
              <button class="action-btn why-btn" onclick="toggleWhy('${article.id}', event)">
                📊 왜 중요한가 ▾
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderRightSidebar() {
      const editionData = activeData[currentEdition] || EMBEDDED_DATA[currentEdition];
      
      // Newsfactory
      const nfContainer = document.getElementById("nf-items-container");
      nfContainer.innerHTML = "";
      editionData.newsfactory.items.forEach(item => {
        const div = document.createElement("div");
        div.className = "nf-item";
        div.onclick = openNewsFactoryModal;
        div.innerHTML = `
          <div class="nf-item-icon">📋</div>
          <div class="nf-item-content">
            <h4>${item.title}</h4>
            <p>${item.desc}</p>
          </div>
        `;
        nfContainer.appendChild(div);
      });

      // SOOP
      const soopContainer = document.getElementById("soop-items-container");
      soopContainer.innerHTML = "";
      editionData.soop.forEach(item => {
        const div = document.createElement("div");
        div.className = "streamer-item";
        div.innerHTML = `
          <div class="streamer-avatar">${item.name[0]}</div>
          <div class="streamer-info">
            <h5>${item.name}</h5>
            <p>${item.desc}</p>
          </div>
          <span style="font-size:11px;color:var(--text-dim);">${item.tag}</span>
        `;
        soopContainer.appendChild(div);
      });
    }

    function switchNfTab(tab, el) {
      document.querySelectorAll(".nf-tab").forEach(t => t.classList.remove("active"));
      el.classList.add("active");
    }

    function handleSearch() {
      const query = document.getElementById("search-input").value.toLowerCase();
      const cards = document.querySelectorAll(".news-card");
      cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(query) ? "flex" : "none";
      });
    }

    function renderAll() {
      switchEdition(currentEdition);
    }

    // Auto load on start
    window.addEventListener("DOMContentLoaded", () => loadDataFromRepo(false));
  </script>
</body>
</html>
